[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proteoem"
version = "0.1.0"
description = "Finite-mixture inference for iterative affinity proteomics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Narayanan Raghupathy", email = "narayanan.raghupathy@tensoromics.com" },
]
keywords = [
  "expectation-maximization",
  "proteomics",
  "single-molecule",
  "proteoform",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/narayananr/proteoem"
Repository = "https://github.com/narayananr/proteoem"
Issues = "https://github.com/narayananr/proteoem/issues"

[project.scripts]
proteoem = "proteoem.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
figures = ["matplotlib>=3.8", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
